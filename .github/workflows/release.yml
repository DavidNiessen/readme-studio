name: release

# Keeps the floating major tag (v1, v2, …) pointing at the latest release,
# so profile repositories can reference DavidNiessen/readme-generator@v1.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  major-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move the major tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          major="${TAG%%.*}"
          case "$major" in v[0-9]*) ;; *) echo "::error::release tag $TAG is not semver (vX.Y.Z)"; exit 1 ;; esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$major" -m "$major → $TAG" "$TAG"
          git push origin "$major" --force
