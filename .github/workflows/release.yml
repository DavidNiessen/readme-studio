# A full release, started by hand (Actions › Release › Run workflow). It checks main, raises the
# version, commits it onto a release tag, publishes the GitHub release with generated notes,
# brings main up to the new version and moves the floating major tag (v1, v2, …) that profile
# repositories reference with `uses: DavidNiessen/readme-studio@v1`.
#
# The browser extension is built from the release tag and attached to the release. It is also
# published to the Chrome Web Store and Firefox Add-ons when their keys are set up (see the
# "extension" job); without them that step says so and is skipped.
#
# If the version cannot be brought onto main (main changed package.json meanwhile), fix main and
# use "Re-run failed jobs": the tag and release are kept.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: minor
      version:
        description: Or an exact version (e.g. 1.0.0); overrides the bump
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  release:
    name: Version, tag and publish
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Pick the version
        env:
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          current=$(node -p "require('./package.json').version")
          IFS=. read -r major minor patch <<< "${current%%-*}"
          if [ -n "$EXACT" ]; then version="${EXACT#v}"
          elif [ "$BUMP" = major ]; then version="$((major + 1)).0.0"
          elif [ "$BUMP" = minor ]; then version="${major}.$((minor + 1)).0"
          else version="${major}.${minor}.$((patch + 1))"; fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::$version is not a release version (x.y.z)"; exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then echo "::error::v$version exists already"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The version commit goes onto the tag; main gets it in the next job.
      - name: Commit the version and tag it
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          node scripts/set-version.mjs "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The first release can match the version already on main: then there is nothing to commit.
          if git diff --quiet; then echo "version is already $VERSION"; else git commit -am "chore(release): v$VERSION [skip ci]"; fi
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: gh release create "v$VERSION" --verify-tag --generate-notes --latest --title "Readme Studio $VERSION"

  publish:
    name: Bring main up and move the major tag
    needs: release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Straight onto the tag when main has not moved since; otherwise the tag's version commit is merged in.
      - name: Bring main up to the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
          git merge --ff-only "v$VERSION" || git merge --no-ff --no-edit -m "chore(release): v$VERSION into main [skip ci]" "v$VERSION"
          git push origin HEAD:main

      - name: Move the major tag
        run: |
          major="v${VERSION%%.*}"
          git tag -fa "$major" -m "$major → v$VERSION" "v$VERSION^{commit}"
          git push origin "refs/tags/$major" --force

  extension:
    name: Build and publish the browser extension
    needs: release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        env:
          RS_VERSION: ${{ needs.release.outputs.version }}
          VITE_GITHUB_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
        run: |
          npm ci
          npm run build -w apps/extension

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v$VERSION" apps/extension/dist/*.zip

      # Needs the secrets CHROME_EXTENSION_ID, CHROME_CLIENT_ID, CHROME_CLIENT_SECRET and
      # CHROME_REFRESH_TOKEN (a Google OAuth client with the Chrome Web Store API enabled).
      - name: Publish to the Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          if [ -z "$EXTENSION_ID" ] || [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$REFRESH_TOKEN" ]; then
            echo "::notice::Chrome Web Store keys are not set up; the Chrome package is only attached to the release."
            exit 0
          fi
          token=$(curl -fsS https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" -d grant_type=refresh_token | jq -r .access_token)
          curl -fsS -X PUT -H "Authorization: Bearer $token" -H "x-goog-api-version: 2" \
            -T "apps/extension/dist/readme-studio-chrome-$VERSION.zip" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$EXTENSION_ID" | tee upload.json
          jq -e '.uploadState == "SUCCESS"' upload.json > /dev/null
          curl -fsS -X POST -H "Authorization: Bearer $token" -H "x-goog-api-version: 2" -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$EXTENSION_ID/publish"

      # Needs the secrets AMO_JWT_ISSUER and AMO_JWT_SECRET (addons.mozilla.org → Tools → Manage API
      # keys). The first version of the add-on is submitted by hand; later ones follow from here.
      - name: Publish to Firefox Add-ons
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::notice::Firefox Add-ons keys are not set up; the Firefox package is only attached to the release."
            exit 0
          fi
          npx --yes web-ext@8 sign --source-dir apps/extension/dist/firefox --channel listed --approval-timeout 0
