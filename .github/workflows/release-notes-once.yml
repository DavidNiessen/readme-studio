# One-off: replace the generated notes of v1.0.0. Removed again in the next commit.
name: release notes (one-off)
on:
  push:
    branches: [claude/ecstatic-babbage-uiez1k]
    paths: [.github/release-notes/v1.0.0.md]
permissions:
  contents: write
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v1.0.0 --notes-file .github/release-notes/v1.0.0.md && gh release view v1.0.0 --json name,isLatest,isPrerelease
