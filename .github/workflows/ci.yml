# Checks every change: types, tests, the committed action bundle, a build of the studio and a run
# of the action itself. Runs on pull requests, and is called by the pre-release and release
# workflows before they publish anything.
name: ci

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Action bundle is up to date
        run: |
          npm run bundle
          if ! git diff --quiet -- packages/engine/dist; then
            echo "::error::packages/engine/dist is stale. Run 'npm run bundle' and commit the result."
            git diff --stat -- packages/engine/dist
            exit 1
          fi

      - name: Build the studio
        run: npm run build

      - name: Build the browser extension
        run: npm run build -w apps/extension

      # Mozilla's own checks for the Firefox package (manifest, permissions, unsafe code)
      - name: Lint the Firefox package
        run: npx --yes web-ext@8 lint --source-dir apps/extension/dist/firefox --output text

      - name: Upload the extension packages
        uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: apps/extension/dist/*.zip
          retention-days: 14

  action:
    # Runs the action exactly like a user's profile repository would (sample data, no publishing).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Render the example project
        id: render
        uses: ./
        with:
          config: examples/readme.config.json
          mock: "true"
          dry-run: "true"
          output-dir: example-dist

      - name: Upload rendered example
        uses: actions/upload-artifact@v4
        with:
          name: example-render
          path: example-dist
          retention-days: 7
