<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="150" height="28" viewBox="0 0 150 28" fill="none" role="img" aria-label="version: v1.3.0">
<title>version: v1.3.0</title>
<style>
svg{color-scheme:dark}
text{font-family:rs-jetbrains-mono, 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}
.h{font-family:rs-jetbrains-mono, 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.t{fill:#c0caf5}.m{fill:#787c99}.a{fill:#7aa2f7}.g{fill:#7dcfff}.s{fill:#3b4261}.a2{fill:#bb9af7}
.b{font-weight:700}
.fx{transform-box:fill-box;transform-origin:center}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.2)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinR{to{transform:rotate(-360deg)}}
@keyframes roll{to{transform:translateY(var(--y))}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes shimmer{0%{transform:translateX(-120%)}60%,100%{transform:translateX(220%)}}
.in{animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fadeIn .8s ease both}
.blink{animation:blink 1s step-end infinite}

@media (prefers-reduced-motion: reduce){
  *{animation-delay:0s!important;animation-duration:1ms!important;animation-iteration-count:1!important}
  .loop{animation:none!important}.loop-only{display:none}
}text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.sh{animation:shimmer 6s ease-in-out infinite}
.spin{transform-box:view-box;transform-origin:102.3px 14px;animation:spin 1.1s linear infinite}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
.vseg{transform-box:fill-box;transform-origin:left;animation:growX .6s cubic-bezier(.2,.7,.2,1) 0.18s both}</style>
<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="softglow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#3b4261" opacity="0.55"/></pattern>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" stroke="#3b4261" stroke-width=".6" opacity="0.5"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V10" stroke="#3b4261" stroke-width=".8" opacity="0.35"/></pattern>
<linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7aa2f7"/><stop offset="1" stop-color="#7dcfff"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="0.12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="cardFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1b26" stop-opacity="0"/><stop offset="1" stop-color="#1a1b26"/></linearGradient></defs>
<g class="fade" style="animation-delay:0.08s"><clipPath id="bc"><rect width="150" height="28" rx="5"/></clipPath><g clip-path="url(#bc)"><rect width="150" height="28" fill="none"/><rect x="88.3" width="61.7" height="28" fill="#7aa2f7" opacity=".12"/><rect class="sh loop loop-only" x="-60" width="48" height="28" fill="url(#shine)" transform="skewX(-20)" style="animation-delay:2.35s"/></g><rect x=".5" y=".5" width="149" height="27" rx="4.5" stroke="#7aa2f7" stroke-opacity="0.9"/><svg x="10" y="7" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#7aa2f7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2.5h5.5l6.5 6.5-5 5L2.5 7.5zM5 5h.01"/></svg><text x="30.0" y="18.1" font-size="11.5" fill="#787c99" textLength="48.3" lengthAdjust="spacingAndGlyphs">version</text><g class="fade" style="animation-delay:0.33s"><text x="98.3" y="18.1" font-size="11.5" fill="#7aa2f7" font-weight="700" textLength="41.4" lengthAdjust="spacingAndGlyphs">v1.3.0</text></g></g>
