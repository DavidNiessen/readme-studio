<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Readme Studio: animated GitHub READMEs</title>
    <meta name="description" content="Design an animated GitHub profile or project README in the browser. A GitHub Action re-renders it every night with your latest numbers." />
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e0d" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Readme Studio" />
    <meta property="og:description" content="Design animated, self-updating GitHub profile and project READMEs." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Readme Studio" />
    <meta property="og:url" content="https://readme.niessen.dev/" />
    <!-- link previews need an absolute address; made by scripts/og-image.ts -->
    <meta property="og:image" content="https://readme.niessen.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Readme Studio: animated, self-updating GitHub READMEs, designed in the browser" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://readme.niessen.dev/og.png" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      try {
        var t = localStorage.getItem("rs:ui-theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
