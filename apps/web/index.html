<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Readme Studio: animated GitHub profile READMEs</title>
    <meta name="description" content="Design an animated GitHub profile README in the browser. A GitHub Action re-renders it every night with your latest numbers." />
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e0d" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Readme Studio" />
    <meta property="og:description" content="Design an animated, self-updating GitHub profile README." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      try {
        var t = localStorage.getItem("rs:ui-theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
