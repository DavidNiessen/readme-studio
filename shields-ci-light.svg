<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="155" height="28" viewBox="0 0 155 28" fill="none" role="img" aria-label="pages: passing">
<title>pages: passing</title>
<style>
svg{color-scheme:light}
text{font-family:rs-jetbrains-mono, 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}
.h{font-family:rs-jetbrains-mono, 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.t{fill:#343b58}.m{fill:#6c6e75}.a{fill:#2e7de9}.g{fill:#1d5fc0}.s{fill:#c4c5cc}.a2{fill:#9854f1}
.b{font-weight:700}
.fx{transform-box:fill-box;transform-origin:center}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.2)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinR{to{transform:rotate(-360deg)}}
@keyframes roll{to{transform:translateY(var(--y))}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes shimmer{0%{transform:translateX(-120%)}60%,100%{transform:translateX(220%)}}
.in{animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fadeIn .8s ease both}
.blink{animation:blink 1s step-end infinite}

@media (prefers-reduced-motion: reduce){
  *{animation-delay:0s!important;animation-duration:1ms!important;animation-iteration-count:1!important}
  .loop{animation:none!important}.loop-only{display:none}
}text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.sh{animation:shimmer 6s ease-in-out infinite}
.spin{transform-box:view-box;transform-origin:88.5px 14px;animation:spin 1.1s linear infinite}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
.vseg{transform-box:fill-box;transform-origin:left;animation:growX .6s cubic-bezier(.2,.7,.2,1) 0.10s both}</style>
<defs>
